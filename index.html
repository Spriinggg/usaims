<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
<title>USIP — US Intern Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='24' fill='%23c3140d'/%3E%3Cpath d='M24 10 L39 34 Q24 40 9 34 Z' fill='%23ffd27a'/%3E%3Cpath d='M9 34 Q24 40.5 39 34' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='21' r='2.8' fill='%23c3140d'/%3E%3Ccircle cx='18' cy='29' r='2.5' fill='%23c3140d'/%3E%3Ccircle cx='30' cy='29' r='2.5' fill='%23c3140d'/%3E%3C/svg%3E">
<style>
  :root{
    --red:#c3140d; --orange:#f39200; --ink:#24303f; --muted:#6b7684;
    --line:#e6e9ef; --bg:#eef1f6; --card:#ffffff; --ok:#1a7f37; --no:#c3140d;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
  button{font-family:inherit;cursor:pointer;}
  .hidden{display:none!important;}
  a{color:var(--red);}

  /* ---------- Login ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--red),var(--orange));padding:16px;}
  .login-card{background:#fff;border-radius:18px;padding:32px 28px;width:100%;max-width:390px;box-shadow:0 24px 60px rgba(0,0,0,.28);}
  .login-brand{text-align:center;margin-bottom:22px;}
  .login-mark{display:inline-flex;padding:10px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--orange));box-shadow:0 8px 20px rgba(195,20,13,.35);margin-bottom:12px;}
  .login-card h1{margin:0;font-size:32px;font-weight:800;letter-spacing:1px;color:var(--red);}
  .login-card h1 .hl{color:var(--orange);}
  .login-card p.sub{margin:3px 0 0;color:var(--muted);font-size:13px;letter-spacing:.5px;}
  .login-rule{height:3px;width:46px;margin:14px auto 0;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--orange));}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  .field textarea{resize:vertical;}
  .btn{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;}
  .btn:hover{opacity:.92;}
  .btn.full{width:100%;}
  .btn.ghost{background:#fff;color:var(--red);border:1px solid var(--red);}
  .btn.ok{background:var(--ok);}
  .btn.sm{padding:5px 10px;font-size:12.5px;}
  .btn.icon{padding:5px 9px;border-radius:6px;}
  .err{color:var(--no);font-size:12.5px;margin-top:8px;min-height:16px;}
  .switch{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted);}
  .switch b{color:var(--red);cursor:pointer;}

  /* ---------- Shell ---------- */
  header.top{background:linear-gradient(90deg,var(--red),var(--orange));color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;}
  header.top .brand{display:flex;align-items:center;gap:11px;}
  header.top .brandmark{width:40px;height:40px;display:flex;filter:drop-shadow(0 1px 3px rgba(0,0,0,.25));}
  header.top .brandword{font-weight:800;font-size:23px;letter-spacing:.3px;line-height:1;}
  header.top .brandword .hl{color:#ffe0a3;}
  header.top .spacer{flex:1;}
  header.top .who{font-size:13px;font-weight:600;text-align:right;line-height:1.2;}
  header.top .who small{display:block;font-weight:400;opacity:.85;font-size:11px;}
  .layout{display:flex;min-height:calc(100vh - 46px);}
  nav.side{width:210px;background:#fff;border-right:1px solid var(--line);padding:12px 0;flex-shrink:0;}
  nav.side a{display:flex;align-items:center;gap:9px;padding:11px 18px;color:var(--ink);text-decoration:none;font-size:13.5px;border-left:3px solid transparent;}
  nav.side a:hover{background:#faf3f2;}
  nav.side a.active{background:#fdeceb;border-left-color:var(--red);color:var(--red);font-weight:600;}
  nav.side .ico{width:18px;text-align:center;}
  main.content{flex:1;padding:20px;min-width:0;}
  .page-title{font-size:16px;color:var(--red);margin:0 0 14px;font-weight:700;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .toolbar .grow{flex:1;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top;}
  th{background:#faf3f2;color:#8a1510;font-weight:600;font-size:12px;}
  tr:hover td{background:#fcfcfd;}
  .status{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .s-draft{background:#eceff3;color:#5a6472;}
  .s-submitted{background:#fde8cf;color:#9a5b00;}
  .s-verified{background:#dff3e4;color:#1a7f37;}
  .s-rejected{background:#fbdad7;color:#c3140d;}

  /* profile card */
  .pcard{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
  .pcard img,.pcard .ph{width:92px;height:92px;border-radius:10px;object-fit:cover;background:#eef1f6;display:flex;align-items:center;justify-content:center;color:#b6bdc8;font-size:30px;border:1px solid var(--line);}
  .pcard h2{margin:0 0 3px;font-size:17px;}
  .pcard .meta{color:var(--muted);font-size:12.5px;line-height:1.5;}
  .kv{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;font-size:13px;margin-top:8px;}
  .kv .k{color:var(--muted);}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,25,35,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:50;overflow:auto;}
  .modal{background:#fff;border-radius:12px;max-width:640px;width:100%;padding:20px;}
  .modal h3{margin:0 0 12px;color:var(--red);font-size:16px;}
  .counter{font-size:11px;color:var(--muted);text-align:right;margin-top:3px;}
  #en_editor{height:300px;background:#fff;}
  .ql-editor{min-height:260px;font-size:14px;line-height:1.55;}
  .ql-toolbar.ql-snow,.ql-container.ql-snow{border-color:#e3e6ea;}
  .ql-toolbar.ql-snow{border-top-left-radius:8px;border-top-right-radius:8px;}
  .ql-container.ql-snow{border-bottom-left-radius:8px;border-bottom-right-radius:8px;}
  .rt-view{background:#fafbfc;border:1px solid #e3e6ea;border-radius:8px;padding:12px 14px;line-height:1.55;font-size:14px;max-height:420px;overflow:auto;}
  .rt-view p{margin:6px 0;} .rt-view ul,.rt-view ol{margin:6px 0 6px 22px;} .rt-view h1,.rt-view h2,.rt-view h3{margin:10px 0 4px;} .rt-view blockquote{border-left:3px solid var(--orange);margin:8px 0;padding-left:12px;color:#444;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;}
  .toast.show{opacity:1;}
  .muted{color:var(--muted);}
  .hint{font-size:12px;color:var(--muted);margin:4px 0 0;}
  @media(max-width:720px){nav.side{width:60px;}nav.side a span.lbl{display:none;}.kv{grid-template-columns:1fr;}}
.pwwrap{position:relative}
.pwwrap input{padding-right:62px!important}
.pweye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#c3140d;font-size:.78rem;font-weight:700;cursor:pointer;padding:4px}
.pweye:hover{text-decoration:underline}
</style>
</head>
<body>

          <circle cx="24" cy="24" r="23" fill="none" stroke="#c3140d" stroke-width="2"/>

<!-- ================= APP SHELL ================= -->
<div id="app" class="hidden">
  <header class="top">
    <div class="brand">
      <span class="brandmark">
        <svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true">
          <circle cx="24" cy="24" r="23" fill="#fff"/>

          <path d="M24 11 L37 33 Q24 38 11 33 Z" fill="#f39200"/>
          <path d="M11 33 Q24 38.5 37 33" fill="none" stroke="#c3140d" stroke-width="3.2" stroke-linecap="round"/>
          <circle cx="24" cy="21" r="2.4" fill="#c3140d"/>
          <circle cx="19" cy="28" r="2.1" fill="#c3140d"/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script>
/* =======================================================================
   CONFIG  —  paste your NEW Supabase project URL + anon key here
   (Supabase dashboard → Project Settings → API)
   ======================================================================= */
const CONFIG = {
  url: "https://llophlfkkyunjoldxajc.supabase.co",
  key: "sb_publishable_IsRzt4DqWqF6IsK-TfF24w_ALn4n6dp"
};
/* ======================================================================= */

const sb = window.supabase.createClient(CONFIG.url, CONFIG.key);
const DEFAULT_START = "2026-09-21";   // fallback internship start if a student's start date is empty
const MAX_CHARS = 5000;

let ME = null;        // my profile row
let DEPTS = [];       // departments cache

/* ---------- small helpers ---------- */
const $ = (id)=>document.getElementById(id);
const el = (html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function titleCase(s){return (s==null?'':String(s)).toLowerCase().replace(/([a-z])([a-z]*)/g,(m,a,b)=>a.toUpperCase()+b);}
function isHtml(s){return /<[a-z/][\s\S]*>/i.test(s||'');}
function stripHtml(h){if(!h)return '';if(!isHtml(h))return h;const d=document.createElement('div');d.innerHTML=h;return (d.textContent||'').replace(/\s+/g,' ').trim();}
function renderRich(h){if(h==null||(''+h).trim()==='')return '<span class="muted">(empty)</span>';return isHtml(h)?h:'<div style="white-space:pre-wrap">'+esc(h)+'</div>';}
function escProg(s){return esc(titleCase(s));}  // programme shown in Title Case
function fmtDate(d){const x=new Date(d);return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function dayName(d){return new Date(d).toLocaleDateString('en-GB',{weekday:'short'});}
function iso(d){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;}

/* week ranges (Mon–Sun) from start..end */
function mondayOf(d){const x=new Date(d);const g=(x.getDay()+6)%7;x.setDate(x.getDate()-g);x.setHours(0,0,0,0);return x;}
function buildWeeks(start,end){
  const s=mondayOf(start||DEFAULT_START);
  const e=end?new Date(end):new Date(new Date(s).setDate(s.getDate()+20*7));
  const weeks=[];let cur=new Date(s);let n=1;
  while(cur<=e && n<=40){
    const ws=new Date(cur), we=new Date(cur);we.setDate(we.getDate()+6);
    weeks.push({n,start:new Date(ws),end:new Date(we)});
    cur.setDate(cur.getDate()+7);n++;
  }
  return weeks;
}

/* =======================================================================
   AUTH
   ======================================================================= */
$('go_signup').onclick=()=>{$('loginForm').classList.add('hidden');$('signupForm').classList.remove('hidden');};
$('go_login').onclick =()=>{$('signupForm').classList.add('hidden');$('loginForm').classList.remove('hidden');};

$('li_btn').onclick=async()=>{
  $('li_err').textContent='';
  const email=$('li_email').value.trim(), pw=$('li_pw').value;
  if(!email||!pw){$('li_err').textContent='Please fill in email and password.';return;}
  $('li_btn').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  $('li_btn').disabled=false;
  if(error){$('li_err').textContent=error.message;return;}
  boot();
};

$('su_btn').onclick=async()=>{
  $('su_err').textContent='';
  const name=$('su_name').value.trim().toUpperCase(), matric=$('su_matric').value.trim().toUpperCase(),
        prog=titleCase($('su_prog').value.trim()), email=$('su_email').value.trim().toLowerCase(), pw=$('su_pw').value;
  if(!name||!email||!pw){$('su_err').textContent='Name, email and password are required.';return;}
  $('su_btn').disabled=true;
  const {error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:name,matric_no:matric,programme:prog}}});
  $('su_btn').disabled=false;
  if(error){$('su_err').textContent=error.message;return;}
  toast('Account created. You can log in now.');
  $('go_login').onclick();
  $('li_email').value=email;
};

$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload();};
$('pwBtn').onclick=changePassModal;

/* show/hide password — works for static fields and modal fields */
document.addEventListener('click',e=>{
  const b=e.target.closest('.pweye'); if(!b)return;
  const inp=document.getElementById(b.dataset.for); if(!inp)return;
  if(inp.type==='password'){inp.type='text';b.textContent='Hide';}
  else{inp.type='password';b.textContent='Show';}
});

function changePassModal(){
  const m=el(`<div class="modal-bg"><div class="modal">
    <h3>Change Password</h3>
    <div class="field"><label>New Password</label><div class="pwwrap"><input id="cp_pw" type="password" placeholder="min 6 characters"><button type="button" class="pweye" data-for="cp_pw">Show</button></div></div>
    <div class="field"><label>Confirm New Password</label><div class="pwwrap"><input id="cp_pw2" type="password" placeholder="retype password"><button type="button" class="pweye" data-for="cp_pw2">Show</button></div></div>
    <div class="err" id="cp_err"></div>
    <div class="modal-actions"><button class="btn ghost" id="cp_cancel">Cancel</button><button class="btn" id="cp_save">Update Password</button></div>
  </div></div>`);
  document.body.appendChild(m);
  m.querySelector('#cp_cancel').onclick=()=>m.remove();
  m.querySelector('#cp_save').onclick=async()=>{
    const pw=m.querySelector('#cp_pw').value, pw2=m.querySelector('#cp_pw2').value;
    const err=m.querySelector('#cp_err');
    if(pw.length<6){err.textContent='Password must be at least 6 characters.';return;}
    if(pw!==pw2){err.textContent='Passwords do not match.';return;}
    const btn=m.querySelector('#cp_save');btn.disabled=true;
    const {error}=await sb.auth.updateUser({password:pw});
    btn.disabled=false;
    if(error){err.textContent=error.message;return;}
    m.remove();toast('Password updated.');
  };
}

/* =======================================================================
   BOOT
   ======================================================================= */
async function boot(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){$('login').classList.remove('hidden');$('app').classList.add('hidden');return;}
  // load my profile (retry once in case the signup trigger is still creating it)
  let {data:prof}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!prof){ await new Promise(r=>setTimeout(r,600));
    ({data:prof}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle()); }
  if(!prof){ // fallback insert
    await sb.from('profiles').insert({id:user.id});
    ({data:prof}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle());
  }
  ME=prof; ME.email=user.email;
  await loadDepts();
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  $('whoName').innerHTML=esc(ME.full_name||ME.email)+'<small>'+(ME.role==='supervisor'?'Supervisor':'Intern')+'</small>';
  if(ME.role==='supervisor') renderSupervisor(); else renderStudent();
}

async function loadDepts(){
  const {data}=await sb.from('departments').select('*').order('name');
  DEPTS=data||[];
}

/* =======================================================================
   STUDENT UI
   ======================================================================= */
function renderStudent(){
  $('sidebar').innerHTML='';
  const items=[['duty','🪪','Duty Info'],['log','📒','Log Book']];
  items.forEach(([k,ic,lbl])=>{
    const a=el(`<a data-k="${k}"><span class="ico">${ic}</span><span class="lbl">${lbl}</span></a>`);
    a.onclick=()=>{setActive(k);k==='duty'?studentDuty():studentLog();};
    $('sidebar').appendChild(a);
  });
  setActive('duty');studentDuty();
}
function setActive(k){document.querySelectorAll('nav.side a').forEach(a=>a.classList.toggle('active',a.dataset.k===k));}

function studentDuty(){
  const p=ME;
  $('view').innerHTML=`
   <h1 class="page-title">Duty Information</h1>
   <div class="card">
     <div class="pcard">
       ${p.photo_url?`<img src="${esc(p.photo_url)}">`:`<div class="ph">👤</div>`}
       <div>
         <h2>${esc(p.full_name||'(name)')}</h2>
         <div class="meta">${escProg(p.programme||'')}<br>${esc(p.matric_no||'')} &nbsp;·&nbsp; ${esc(p.email||'')}</div>
       </div>
       <div style="flex:1"></div>
       <div>${p.duty_verified?'<span class="status s-verified">Duty Verified</span>':'<span class="status s-submitted">Not verified</span>'}</div>
     </div>
   </div>
   <div class="card">
     <div class="toolbar"><b class="grow">My Internship Info</b><button class="btn sm" id="editDuty">Edit</button></div>
     <div class="kv">
       <div class="k">University</div><div>${esc(p.company_name||'—')}</div>
       <div class="k">University Address</div><div>${esc(p.company_address||'—')}</div>
       <div class="k">Report on Duty</div><div>${p.report_on_duty?fmtDate(p.report_on_duty):'—'}</div>
       <div class="k">Internship Period</div><div>${p.internship_start?fmtDate(p.internship_start):'—'} to ${p.internship_end?fmtDate(p.internship_end):'—'}</div>
       <div class="k">Department</div><div>${esc((DEPTS.find(d=>d.id===p.department_id)||{}).name||'—')}</div>
       <div class="k">Phone Number</div><div>${esc(p.mobile_tel||'—')}</div>
       <div class="k">Contact Email</div><div>${esc(p.supervisor_email||'—')}</div>
     </div>
   </div>`;

async function uploadFile(f){
  const path=`${ME.id}/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const {error}=await sb.storage.from('uploads').upload(path,f,{upsert:true});
  if(error){toast('Upload failed: '+error.message);return null;}
  return sb.storage.from('uploads').getPublicUrl(path).data.publicUrl;
}

let STU_WEEK=null, STU_ENTRIES={};
async function studentLog(){
  const weeks=buildWeeks(ME.internship_start,ME.internship_end);
  if(STU_WEEK===null){ // default to current week if within range else week 1
    const today=new Date();STU_WEEK=weeks.findIndex(w=>today>=w.start&&today<=w.end);if(STU_WEEK<0)STU_WEEK=0;
  }
  $('view').innerHTML=`
   <h1 class="page-title">Log Book</h1>
   <div class="card">
     <div class="toolbar">
       <label class="muted">Week</label>
       <select id="wk">${weeks.map((w,i)=>`<option value="${i}" ${i===STU_WEEK?'selected':''}>WEEK ${w.n} : ${fmtDate(w.start)} - ${fmtDate(w.end)}</option>`).join('')}</select>
     </div>
     <table><thead><tr><th>Date / Day</th><th>Log / Activity</th><th>Last Updated</th><th>Status</th><th>Action</th></tr></thead>
     <tbody id="logRows"></tbody></table>
   </div>`;
  $('wk').onchange=e=>{STU_WEEK=+e.target.value;loadStudentWeek(weeks);};
  loadStudentWeek(weeks);
}
async function loadStudentWeek(weeks){
  const w=weeks[STU_WEEK];
  const {data}=await sb.from('logbook_entries').select('*')
    .eq('student_id',ME.id).gte('entry_date',iso(w.start)).lte('entry_date',iso(w.end));
  STU_ENTRIES={};(data||[]).forEach(r=>STU_ENTRIES[r.entry_date]=r);
  const rows=$('logRows');rows.innerHTML='';
  for(let i=0;i<7;i++){
    const d=new Date(w.start);d.setDate(d.getDate()+i);const key=iso(d);
    const e=STU_ENTRIES[key];
    const _t=e?.activity?stripHtml(e.activity):'';const act=_t?esc(_t.slice(0,70))+(_t.length>70?'…':''):'<span class="muted">N/A</span>';
    const st=e?`<span class="status s-${e.status}">${e.status}</span>`:'<span class="muted">—</span>';
    const canEdit=!e || e.status!=='verified';
    const tr=el(`<tr>
      <td><b>${fmtDate(d)}</b><br><span class="muted">${dayName(d)}</span></td>
      <td>${act}${e?.remarks?`<br><span class="muted" style="color:#c3140d">Remarks: ${esc(e.remarks)}</span>`:''}</td>
      <td>${e?fmtDate(e.updated_at):'<span class="muted">—</span>'}</td>
      <td>${st}</td>
      <td></td></tr>`);
    const act_td=tr.lastElementChild;
    const b=el(`<button class="btn sm ${e?'ghost':''}">${e?(canEdit?'Edit':'View'):'+ Add'}</button>`);
    b.onclick=()=>entryModal(key,weeks);act_td.appendChild(b);
    rows.appendChild(tr);
  }
}

function entryModal(dateKey,weeks){
  const e=STU_ENTRIES[dateKey]||{};
  const locked=e.status==='verified';
  const readonly=e.status==='verified'||e.status==='submitted';   // can't edit text once submitted/verified
  const canDelete=e.id && e.status!=='verified';                  // can delete draft / rejected / submitted (not verified)
  const m=el(`<div class="modal-bg"><div class="modal">
    <h3>Log Entry — ${fmtDate(dateKey)} (${dayName(dateKey)})</h3>
    <div class="field">
      <label>Task / Activity</label>
      ${readonly
        ? `<div class="rt-view">${renderRich(e.activity)}</div>`
        : `<div id="en_editor"></div><div class="counter"><span id="cc">0</span>/${MAX_CHARS}</div>`}
    </div>
    <div class="field"><label>Attachment (optional)</label>
      ${e.attachment_url?`<div class="hint">Current: <a href="${esc(e.attachment_url)}" target="_blank">view file</a></div>`:''}
      ${readonly?'':`<input type="file" id="en_file">`}
    </div>
    ${e.status==='submitted'?`<div class="hint">Already submitted to supervisor. To change it, delete this entry and add again.</div>`:''}
    ${e.remarks?`<div class="hint" style="color:#c3140d">Supervisor remarks: ${esc(e.remarks)}</div>`:''}
    <div class="modal-actions">
      <button class="btn ghost" id="en_cancel">Close</button>
      ${canDelete?`<button class="btn" style="background:#c3140d" id="en_delete">Delete</button>`:''}
      ${readonly?'':`<button class="btn ghost" id="en_draft">Save Draft</button><button class="btn ok" id="en_submit">Submit</button>`}
    </div>
  </div></div>`);
  document.body.appendChild(m);
  let quill=null;
  if(!readonly){
    quill=new Quill(m.querySelector('#en_editor'),{theme:'snow',placeholder:'Describe what you did today...',modules:{toolbar:[
      [{header:[1,2,3,false]}],['bold','italic','underline','strike'],
      [{list:'ordered'},{list:'bullet'}],['blockquote','link'],['clean']
    ]}});
    if(e.activity){ if(isHtml(e.activity)) quill.clipboard.dangerouslyPasteHTML(e.activity); else quill.setText(e.activity); }
    const cc=m.querySelector('#cc');
    const upd=()=>{let n=quill.getText().replace(/\n$/,'').length;if(n>MAX_CHARS){quill.deleteText(MAX_CHARS,n-MAX_CHARS);n=MAX_CHARS;}cc.textContent=n;};
    quill.on('text-change',upd);upd();
  }
  m.querySelector('#en_cancel').onclick=()=>m.remove();
  const delBtn=m.querySelector('#en_delete');
  if(delBtn){ delBtn.onclick=async()=>{
    if(!confirm('Delete this log entry? This cannot be undone.'))return;
    const btns=m.querySelectorAll('button');btns.forEach(b=>b.disabled=true);
    const {error}=await sb.from('logbook_entries').delete().eq('id',e.id);
    btns.forEach(b=>b.disabled=false);
    if(error){toast(error.message);return;}
    m.remove();toast('Entry deleted.');loadStudentWeek(weeks);
  };}
  if(!readonly){
    const save=async(status)=>{
      const btns=m.querySelectorAll('button');btns.forEach(b=>b.disabled=true);
      let url=e.attachment_url||null;
      const f=m.querySelector('#en_file')?.files[0];
      if(f){const u=await uploadFile(f);if(u)url=u;}
      const payload={student_id:ME.id,entry_date:dateKey,activity:quill.root.innerHTML,attachment_url:url,status,updated_at:new Date().toISOString()};
      const {error}=await sb.from('logbook_entries').upsert(payload,{onConflict:'student_id,entry_date'});
      btns.forEach(b=>b.disabled=false);
      if(error){toast(error.message);return;}
      m.remove();toast(status==='submitted'?'Submitted to supervisor.':'Draft saved.');
      loadStudentWeek(weeks);
    };
    m.querySelector('#en_draft').onclick=()=>save('draft');
    m.querySelector('#en_submit').onclick=()=>{if(!quill.getText().trim()){toast('Please write the activity first.');return;}save('submitted');};
  }
}

  if(!DEPTS.length)rows.innerHTML='<tr><td colspan="3" class="muted">No departments yet.</td></tr>';
  DEPTS.forEach(d=>{
    const count=SUP_STUDENTS.filter(s=>s.department_id===d.id).length;
    const tr=el(`<tr><td><b>${esc(d.name)}</b></td><td>${count}</td><td></td></tr>`);
    const b=el('<button class="btn sm ghost">Delete</button>');
    b.onclick=async()=>{if(!confirm('Delete department "'+d.name+'"? Students keep their records but lose this label.'))return;
      const {error}=await sb.from('departments').delete().eq('id',d.id);
      if(error){toast(error.message);return;}await loadDepts();supDepts();toast('Deleted.');};
    tr.lastElementChild.appendChild(b);rows.appendChild(tr);
  });
}

/* ---------- start ---------- */
sb.auth.onAuthStateChange((_e,s)=>{ if(!s){$('app').classList.add('hidden');$('login').classList.remove('hidden');} });
boot();
</script>
</body>
